e offenen Aufgaben und das erstellte Dokument gleichzeitig.",category:"Zusammenarbeit",order:110,tags:["R\xFCckfragen","To-dos","Konzeptdemo"],prompt:"Ich h\xE4tte gern eine KI, die mir drei Aufgaben notiert - eine erledigte, eine in Arbeit und eine offene -, dazu ein kurzes Dokument schreibt und mich zum Schluss fragt, ob sie den offenen Punkt als N\xE4chstes angehen soll. Antworte diese Frage nicht f\xFCr mich, sondern halt dort an, damit ich Aufgabenliste, Dokument und Frage zusammen sehe und selbst antworten kann."},{id:"ragents.reference.prompt.120-canvas-conversation-circle",owner:"ragents.reference",action:"prompt",title:"Eine Gespr\xE4chsrunde auf der Fl\xE4che anordnen",description:"Drei Gespr\xE4chspartner stehen im Kreis um ein Thema. Beschriftete Verbindungen zeigen, wer als N\xE4chstes spricht.",category:"Zusammenarbeit",order:120,tags:["Anwendungsfall","Konzeptdemo","Agententeams","Canvas-Layout"],prompt:"Ich h\xE4tte gern drei KIs mit eigenen Namen und Charakteren, die sich reihum zu einem Thema Deiner Wahl unterhalten, zwei Runden lang, jede mit einem kurzen Satz. Bevor es losgeht, will ich den Aufbau auf der Fl\xE4che neben dem Chat sehen: die drei im Kreis, das Thema als Raute dar\xFCber und Pfeile, die zeigen, wer an wen weitergibt. Am Ende fasst Du mir das Gespr\xE4ch in drei S\xE4tzen zusammen."},{id:"ragents.reference.prompt.130-canvas-pipeline-with-approval",owner:"ragents.reference",action:"prompt",title:"Arbeitsschritte mit Freigabe verbinden",description:"Drei Helfer bearbeiten einen Auftrag nacheinander. Auf der Fl\xE4che sind ihre \xDCbergaben und die n\xF6tige Freigabe zu sehen.",category:"Ereignisse und Abl\xE4ufe",order:130,tags:["Anwendungsfall","Konzeptdemo","Agententeams","Canvas-Layout"],prompt:"Ich h\xE4tte gern drei KIs, die wie an einem Flie\xDFband arbeiten: die erste sammelt Stichpunkte zu einem Thema Deiner Wahl, die zweite schreibt daraus einen kurzen Absatz, die dritte poliert ihn. Auf der Fl\xE4che neben dem Chat will ich die drei in einer Reihe sehen, mit beschrifteten Pfeilen dazwischen, und am Ende eine Raute mit der Frage, ob der Text freigegeben wird. Zeig mir zum Schluss den fertigen Absatz."},{id:"ragents.reference.prompt.140-canvas-team-tree-and-topic-grid",owner:"ragents.reference",action:"prompt",title:"Ein Team und seine Themen anordnen",description:"Ein Teamleiter und drei Helfer bilden einen Baum. Vier Themen stehen daneben; Verbindungen zeigen die Zust\xE4ndigkeiten.",category:"Zusammenarbeit",order:140,tags:["Konzeptdemo","Agententeams","Canvas-Layout"],prompt:"Ich h\xE4tte gern einen Teamleiter, der sich drei Helfer holt und jedem ein Thema Deiner Wahl gibt; jeder Helfer liefert drei Stichpunkte. Dazu einen Beobachter, der am Ende alles in zwei S\xE4tzen bewertet. Auf der Fl\xE4che neben dem Chat will ich das Team als Baum sehen, daneben vier Themen als Kreise in zwei Spalten und gestrichelte Linien von jedem Helfer zu seinem Thema; das vierte bleibt frei. Den Beobachter ordne nicht selbst ein."},{id:"ragents.reference.prompt.150-editorial-workbench",owner:"ragents.reference",action:"prompt",title:"Redaktionswerkstatt",description:"Einen Veranstaltungshinweis k\xFCrzen, \xC4nderungen vergleichen und die redaktionellen Schritte auf der Fl\xE4che verfolgen.",category:"Mini-Apps",order:150,tags:["Actor-Funktionen","Anwendungsfall","Konzeptdemo","Actor-Views","UI.Form","UI.DataTable","UI.TaskProgress","UI.DocumentViewer","UI.DiffViewer","UI.Markdown","UI.SelectMenu","UI.Button","UI.IconButton","UI.Chip","UI.Segmented","UI.MessageList","UI.ListDetail"],prompt:"Ich h\xE4tte gern eine Redaktionswerkstatt: Reparaturtreff, Samstag 10 bis 14 Uhr, Nachbarschaftshaus, ehrenamtliche Hilfe, keine Garantie. Links w\xE4hle ich Original oder Kurzfassung, rechts \xE4ndere ich Text und Zielgruppe und \xFCbernehme K\xFCrzungen einzeln. Zeige \xC4nderungen und Aufgabenstand, vergleiche Wortzahl und Freigabe tabellarisch. Ein Helfer z\xE4hlt die W\xF6rter; ein Protokoll zeigt Absender, \xDCbernahmen und R\xFCcknahmen. Ver\xF6ffentliche nichts."},{id:"ragents.reference.prompt.160-learning-companion",owner:"ragents.reference",action:"prompt",title:"Lernbegleitung mit Unterlagen",description:"Eigene Textunterlagen lokal lesen und Fragen in einem eingebetteten Gespr\xE4ch mit einem Lernbegleiter stellen.",category:"Mini-Apps",order:160,tags:["Anwendungsfall","Konzeptdemo","Agententeams","Actor-Views","LLM-Actor mit View","Actor-Chat","UI.FilePicker","UI.Markdown","UI.SelectMenu","UI.Chat"],prompt:"Ich h\xE4tte gern einen KI-Tutor mit eigener Oberfl\xE4che auf der Arbeitsfl\xE4che: Textunterlagen \xF6ffnen und lesen, daneben mit genau diesem Tutor sprechen. Ich m\xF6chte zwischen Erkl\xE4ren, Beispiel und Verst\xE4ndnispr\xFCfung w\xE4hlen. Die ausgew\xE4hlte Datei soll erst nach meinem Klick im Gespr\xE4ch verwendet werden. Fragen ohne Datei sollen auch gehen. Nutze die vorhandenen Chat-, Datei- und Auswahlbausteine."},{id:"ragents.reference.prompt.170-photo-collection",owner:"ragents.reference",action:"prompt",title:"Bildsammlung mit Beschriftungen",description:"Lokale Bilder sichten, Bildunterschriften pflegen und bei Bedarf einen Schreibhelfer befragen.",category:"Mini-Apps",order:170,tags:["Anwendungsfall","Konzeptdemo","Agententeams","Actor-Views","LLM-Actor mit View","Actor-Chat","UI.FilePicker","UI.Form","UI.DataTable","UI.DocumentViewer","UI.Button","UI.IconButton","UI.Chip","UI.Segmented","UI.Chat"],prompt:"Ich h\xE4tte gern einen KI-Schreibhelfer mit eigener Oberfl\xE4che f\xFCr eine kleine Bildsammlung: Bilder hineinziehen, Vorschauen sehen, die Liste durchsuchen und pro Bild Titel, Bildunterschrift und Alternativtext bearbeiten. Daneben m\xF6chte ich einen Chat mit genau diesem Schreibhelfer und eine lesbare \xDCbersicht aller Beschriftungen. Meine Bilder bleiben lokal, bis ich selbst etwas im Chat sende. Nutze die vorhandenen Bausteine."},{id:"ragents.reference.prompt.180-decision-workbench",owner:"ragents.reference",action:"prompt",title:"Entscheidungswerkstatt",description:"Zwei Optionen in einem lokalen gef\xFChrten Gespr\xE4ch abw\xE4gen und \xC4nderungen am Entscheidungsentwurf vergleichen.",category:"Mini-Apps",order:180,tags:["Anwendungsfall","Konzeptdemo","TypeScript-Actors","Actor-Zustand","Actor-Views","Frei gesteuerter Chat","UI.ChatMessages","UI.ChatInput","UI.TaskProgress","UI.DiffViewer","UI.Chat"],prompt:"Ich h\xE4tte gern eine lokale Entscheidungshilfe: Bibliothek oder Caf\xE9 als Lernort? Feste Fragen f\xFChren durch Ziel, Optionen und Kriterien, protokollieren meine Entscheidung und zeigen den Fortschritt. Bei einer Meinungs\xE4nderung will ich den Unterschied zum vorherigen Entwurf sehen. Ein TypeScript-Actor f\xFChrt den gemeinsamen Fortschritt und die Antworten. Das soll eine klar erkennbare Anleitung ohne KI-Aufrufe sein, mit den vorhandenen Chatbausteinen."},{id:"ragents.reference.prompt.190-review-queue",owner:"ragents.reference",action:"prompt",title:"Texte pr\xFCfen und Ergebnisse gezielt teilen",description:"Drei Textpr\xFCfungen werden getrennt abgearbeitet. Ergebnisse gehen an die zust\xE4ndigen Empf\xE4nger; ein abgemeldeter Pr\xFCfer wird gestoppt.",category:"Mini-Apps",order:190,tags:["Journalpr\xFCfung","Anwendungsfall","Konzeptdemo","Agententeams","Input-Warteschlange","Actor-Stopp","Artefakte und Zugriff","Actor-Views","UI.MessageList"],prompt:"Ich h\xE4tte gern drei getrennte Textpr\xFCfungen zum Nachbarschaftsfest, die ich w\xE4hrend der ersten Pr\xFCfung einreihe. Nur der bestimmte Empf\xE4nger darf das erste Ergebnis lesen; pr\xFCfe auch einen Zugriff ohne Freigabe. Danach meldest du den Pr\xFCfer ab. Belege Reihenfolge, Zugriff und Stopp. Eine Oberfl\xE4che des vorhandenen Koordinators zeigt auf der Fl\xE4che nur ungesch\xFCtzte Statusmeldungen verschiedener Absender. Eine eigene Notiz m\xF6chte ich erg\xE4nzen k\xF6nnen."},{id:"ragents.reference.prompt.20-circle-of-four",owner:"ragents.reference",action:"prompt",title:"Eine Liste durch vier KI-Helfer reichen",description:"Vier Helfer erg\xE4nzen nacheinander dieselbe Liste. Am Ende ist sichtbar, wer was beigetragen hat.",category:"Zusammenarbeit",order:20,tags:["Anwendungsfall","Konzeptdemo","Agententeams","TypeScript-Actors","Subscriptions"],prompt:"Ich h\xE4tte gern vier KIs mit den Namen rot, gelb, blau und gr\xFCn, die reihum ein Wortspiel spielen: jede h\xE4ngt ein Wort an, das ihr zum zuletzt genannten einf\xE4llt. Nach zw\xF6lf Beitr\xE4gen ist Schluss, und ich will die fertige Liste als Dokument sehen."},{id:"ragents.reference.prompt.200-typescript-diagnostics",owner:"ragents.reference",action:"prompt",title:"Fehler in einer Terminliste finden",description:"Eine kleine TypeScript-Terminliste mit der Sprachpr\xFCfung untersuchen, zwei Fehler korrigieren und den Befund vergleichen.",category:"Code und Diagnose",order:200,tags:["Anwendungsfall","Konzeptdemo","Sprachpr\xFCfung"],prompt:"Ich h\xE4tte gern eine kleine TypeScript-Terminliste mit zwei absichtlichen Typfehlern. Lass die Sprachpr\xFCfung beide finden und korrigiere sie einzeln. Nach jeder Korrektur m\xF6chte ich den echten Befund sehen. Am Ende bleiben das korrigierte Beispiel und ein kurzer Vergleich zum Nachlesen. Falls die Sprachpr\xFCfung fehlt, sag das klar."},{id:"ragents.reference.prompt.210-moderator-handover",owner:"ragents.reference",action:"prompt",title:"Gespr\xE4ch an einen Moderator \xFCbergeben",description:"Ein Workshop-Moderator wird zum direkten Ansprechpartner im Chat und f\xFChrt eine kurze Ideenrunde.",category:"Zusammenarbeit",order:210,tags:["R\xFCckfragen","To-dos","Anwendungsfall","Konzeptdemo","Agententeams","Primary-Actor","Canvas-Layout"],prompt:"Ich h\xE4tte gern einen Workshop f\xFCr einen ruhigeren Arbeitstag: Ein Planer bringt zwei Ideen mit, ein skeptischer Gast pr\xFCft die Nachteile. Ein Moderator \xFCbernimmt die Runde und spricht danach direkt mit mir im Chat, damit ich einen Vorschlag ausw\xE4hlen kann. Zeig die drei auf der Fl\xE4che und \xFCbergib das Gespr\xE4ch wirklich an den Moderator. Seine Aufgabenliste zeigt den Fortschritt."},{id:"ragents.reference.prompt.220-actor-approval-list",owner:"ragents.reference",action:"prompt",title:"Vorschl\xE4ge gemeinsam freigeben",description:"Ein KI-Helfer schl\xE4gt Eintr\xE4ge vor. Im gemeinsamen Fenster lassen sie sich pr\xFCfen und best\xE4tigen; der Chat sieht denselben Stand.",category:"Mini-Apps",order:220,tags:["Anwendungsfall","Konzeptdemo","Agententeams","Actor-Funktionen","Actor-Zustand","Actor-Views","LLM-Actor mit View","Frei gesteuerter Chat","UI.ChatMessages","UI.ChatInput","UI.Chat"],prompt:"Ich h\xE4tte gern einen KI-Listenhelfer mit eigener Oberfl\xE4che. Dort pr\xFCfe und best\xE4tige ich seine Vorschl\xE4ge; best\xE4tigte Eintr\xE4ge stehen daneben. Der Helfer benutzt dieselben Funktionen und dieselbe Liste, wenn ich ihn im Chat um einen Eintrag bitte. Lass ihn einen echten Vorschlag machen. Die Freigabe per Knopf soll ohne weitere KI-Antwort seinen gespeicherten Vorschlag best\xE4tigen. Danach m\xF6chte ich selbst einen eingeben."},{id:"ragents.reference.prompt.230-shared-state-views",owner:"ragents.reference",action:"prompt",title:"Eine Liste in zwei Ansichten",description:"In einem Fenster Aufgaben pflegen, im anderen offene und erledigte Aufgaben z\xE4hlen. Beide Ansichten aktualisieren sich gemeinsam.",category:"Mini-Apps",order:230,tags:["Anwendungsfall","Konzeptdemo","Actor-Funktionen","Actor-Zustand","Actor-Views","UI.Form","UI.Button","UI.TaskProgress"],prompt:"Ich h\xE4tte gern eine Aufgabenliste mit zwei kleinen Fenstern: In einem erg\xE4nze und erledige ich Aufgaben, im anderen sehe ich nur offene und erledigte Anzahlen. Beide geh\xF6ren zum selben Helfer und benutzen dieselben Daten. Erg\xE4nze wirklich eine Aufgabe und erledige sie. Beide Fenster sollen sofort mitziehen. Danach blende nur die Zusammenfassung aus und wieder ein; meine Liste bleibt erhalten."},{id:"ragents.reference.prompt.240-live-result-list",owner:"ragents.reference",action:"prompt",title:"Antworten automatisch sammeln",description:"Die Antworten zweier KI-Helfer erscheinen automatisch in einer Ergebnisliste. Neue Beitr\xE4ge kommen ohne manuelles Kopieren dazu.",category:"Mini-Apps",order:240,tags:["Anwendungsfall","Konzeptdemo","TypeScript-Actors","Subscriptions","Actor-Zustand","Actor-Views","UI.MessageList","UI.Markdown"],prompt:"Ich h\xE4tte gern zwei KI-Helfer, die je eine kurze Idee f\xFCr einen gemeinsamen Lernnachmittag vorschlagen. Ihre fertigen Antworten sollen automatisch in einer kleinen Ergebnisliste auf der Arbeitsfl\xE4che erscheinen. Ein programmierter Sammler merkt sich die Beitr\xE4ge; daf\xFCr soll keine weitere KI die Texte kopieren. Lass danach einen Helfer eine zweite Idee erg\xE4nzen. Die Liste soll von selbst wachsen, auch wenn Du im Chat gerade nichts schreibst."},{id:"ragents.reference.prompt.30-llm-without-runtime-knowledge",owner:"ragents.reference",action:"prompt",title:"Eine Nachricht \xFCberbringen lassen",description:"Ein Postbote bringt die Begr\xFC\xDFung eines KI-Helfers zu einem zweiten, ohne technische Absenderdaten offenzulegen.",category:"Zusammenarbeit",order:30,tags:["Konzeptdemo","Agententeams","Subscriptions","Actor-Stopp"],prompt:"Ich h\xE4tte gern zwei KIs, anna und ben, die sich genau einmal freundlich begr\xFC\xDFen, ohne voneinander oder von der Technik dahinter zu wissen: anna sagt einen herzlichen Satz, ben antwortet einmal darauf, danach ist Schluss. Sag mir hinterher kurz, dass wirklich nur in diese eine Richtung weitergereicht wurde und danach alles wieder aufger\xE4umt ist."},{id:"ragents.reference.prompt.35-actor-input-fifo",owner:"ragents.reference",action:"prompt",title:"Drei Auftr\xE4ge der Reihe nach erledigen",description:"Ein besch\xE4ftigter Helfer erh\xE4lt weitere Auftr\xE4ge und arbeitet sie anschlie\xDFend vollst\xE4ndig und in der richtigen Reihenfolge ab.",category:"Ereignisse und Abl\xE4ufe",order:35,tags:["Journalpr\xFCfung","Konzeptdemo","Input-Warteschlange"],prompt:'Ich h\xE4tte gern einen Helfer, der jeden Text, den ich ihm gebe, mit "ERLEDIGT: " und dem unver\xE4nderten Text beantwortet und beim Wort "eins" vorher ausgiebig nachdenkt. W\xE4hrend er noch an "eins" sitzt, schiebe ich ihm "zwei" und "drei" hinterher. Zeig mir danach mit Belegen, dass er alle drei sauber getrennt und genau in dieser Reihenfolge abgearbeitet hat und nichts vermischt wurde.'},{id:"ragents.reference.prompt.40-subscription-matrix",owner:"ragents.reference",action:"prompt",title:"Gezielt bei anderen Helfern mith\xF6ren",description:"Zwei Zuh\xF6rer verfolgen unterschiedliche Beitr\xE4ge. Eine Tabelle zeigt, welche Nachrichten und T\xE4tigkeiten bei wem angekommen sind.",category:"Ereignisse und Abl\xE4ufe",order:40,tags:["Journalpr\xFCfung","Konzeptdemo","Subscriptions"],prompt:"Ich h\xE4tte gern drei KIs a, b und c und dazu zwei Zuh\xF6rer: der eine soll nur mitbekommen, was a und b sagen, der andere nur, wenn eine der drei tats\xE4chlich etwas ausgef\xFChrt hat. Lass danach alle drei etwas sagen und mindestens eine wirklich etwas tun. Gib mir am Ende eine Tabelle, bei welchem Zuh\xF6rer was angekommen ist und was nicht, und belege sie."},{id:"ragents.reference.prompt.50-subscription-removal",owner:"ragents.reference",action:"prompt",title:"Eine Weiterleitung wieder abschalten",description:"Eine Nachricht wird weitergereicht. Nach dem Abschalten der Weiterleitung bleibt der Empf\xE4nger bei der n\xE4chsten Nachricht still.",category:"Ereignisse und Abl\xE4ufe",order:50,tags:["Konzeptdemo","Subscriptions"],prompt:'Ich h\xE4tte gern drei KIs: eine Quelle, eine Senke und eine dazwischen, die jedes Wort der Quelle wortgleich an die Senke durchreicht. Lass die Quelle zuerst "eins" sagen, nimm der mittleren danach das Mith\xF6ren wieder weg und lass die Quelle "zwei" sagen. Erkl\xE4r mir mit Belegen, was beim zweiten Mal passiert und ob bei der Senke noch etwas ankommt.'},{id:"ragents.reference.prompt.60-stop-in-the-circle",owner:"ragents.reference",action:"prompt",title:"Einen Helfer in der Gespr\xE4chsrunde stoppen",description:"Vier Helfer reichen eine Liste im Kreis. Nach dem Stopp eines Helfers wird sichtbar, wo die n\xE4chste Runde endet.",category:"Ereignisse und Abl\xE4ufe",order:60,tags:["Journalpr\xFCfung","Konzeptdemo","Actor-Stopp"],prompt:"Ich h\xE4tte gern vier KIs rot, gelb, blau und gr\xFCn, die im Kreis eine Liste weiterreichen und jede eine eigene Zeile anh\xE4ngt. Sobald die Liste einmal ganz herum war, schalte blau ab. Erz\xE4hl mir mit Belegen, woran die n\xE4chste Runde scheitert und ob gr\xFCn danach \xFCberhaupt noch etwas bekommt."},{id:"ragents.reference.prompt.65-artifact-least-privilege",owner:"ragents.reference",action:"prompt",title:"Eine Notiz gezielt weitergeben",description:"Eine geheime Notiz wird mit einem Helfer geteilt. Ein anderer kann sie nicht lesen, obwohl er von ihr wei\xDF.",category:"Dateien und Ergebnisse",order:65,tags:["Konzeptdemo","Artefakte und Zugriff"],prompt:"Ich h\xE4tte gern drei KIs: die erste schreibt eine kurze geheime Notiz und gibt sie ausdr\xFCcklich an die zweite weiter, die dritte erf\xE4hrt nur, dass es die Notiz gibt. Pr\xFCf f\xFCr mich, wer sie wirklich lesen kann und wer nicht, und ob der abgelehnte Versuch daran etwas \xE4ndert. Den Inhalt der Notiz schreibst Du mir dabei nicht noch einmal hin."},{id:"ragents.reference.prompt.70-headless-counter",owner:"ragents.reference",action:"prompt",title:"Nachrichten ohne KI mitz\xE4hlen",description:"Ein kleines TypeScript-Programm z\xE4hlt eingehende Texte und merkt sich den Stand, ohne Oberfl\xE4che oder weitere KI-Aufrufe.",category:"TypeScript ohne Oberfl\xE4che",order:70,tags:["Anwendungsfall","Konzeptdemo","TypeScript-Actors","Actor-Funktionen","Actor-Zustand","Journalpr\xFCfung"],prompt:'Ich h\xE4tte gern einen kleinen TypeScript-Z\xE4hler ohne Oberfl\xE4che und ohne KI-Aufrufe. Schicke ihm nacheinander die Texte "eins", "zwei" und "drei". Er soll jeden Text in seiner eigenen Liste behalten und mitz\xE4hlen. Danach lies seinen Stand aus und belege, dass drei getrennte Eingaben verarbeitet wurden. Der Z\xE4hler soll f\xFCr weitere Texte bereitbleiben.'},{id:"ragents.reference.prompt.75-lsp-demo",owner:"ragents.reference",action:"prompt",title:"Fehler in C# und TypeScript finden",description:"Die Sprachpr\xFCfung findet zwei absichtliche Fehler in einem kleinen Beispielprojekt und best\xE4tigt anschlie\xDFend ihre Korrektur.",category:"Code und Diagnose",order:75,tags:["Konzeptdemo","Sprachpr\xFCfung"],prompt:"Ich h\xE4tte gern eine kleine Vorf\xFChrung der eingebauten Sprachpr\xFCfung: Lege zwei winzige Wegwerf-Projekte an, eines in C# und eines in TypeScript, und baue in beide einen absichtlichen Fehler ein. Zeig mir, wie die Sprachpr\xFCfung die Fehler findet und was sie genau meldet. Danach behebst Du beide Fehler, zeigst, dass nichts mehr angemeckert wird, und r\xE4umst die Projekte wieder weg."},{id:"ragents.reference.prompt.80-actor-text-analysis",owner:"ragents.reference",action:"prompt",title:"Zeichen, W\xF6rter und Zeilen z\xE4hlen",description:"Eine kleine Textanalyse l\xE4sst sich im eigenen Fenster und im Chat bedienen. Beide Wege teilen denselben Aufrufz\xE4hler.",category:"Mini-Apps",order:10,tags:["Anwendungsfall","Konzeptdemo","TypeScript-Actors","Actor-Funktionen","Actor-Zustand","Actor-Views","Automatische View-Platzierung","View-Sichtbarkeit"],prompt:'Ich h\xE4tte gern eine Textanalyse auf der Arbeitsfl\xE4che: Textfeld, Z\xE4hlknopf f\xFCr Zeichen, W\xF6rter und Zeilen sowie verst\xE4ndliche Fehler. Ein TypeScript-Actor soll seine Aufrufe mitz\xE4hlen, ohne eine KI zu fragen. Pr\xFCfe die Zeilen "Die Welt ist gro\xDF." und "Und sch\xF6n.": 6 W\xF6rter, 2 Zeilen. Die Oberfl\xE4che zeigt denselben Aufrufz\xE4hler. Verstecke sie kurz und zeige sie wieder, ohne Zustand oder Actor neu anzulegen.'},{id:"ragents.reference.prompt.90-actor-notes",owner:"ragents.reference",action:"prompt",title:"Notizen ausblenden und wiederfinden",description:"Eine kleine Notizliste l\xE4sst sich aus der Arbeitsfl\xE4che ausblenden. Beim Wiederanzeigen sind ihre Eintr\xE4ge noch da.",category:"Mini-Apps",order:90,tags:["Anwendungsfall","Konzeptdemo","TypeScript-Actors","Actor-Funktionen","Actor-Zustand","Actor-Views","Automatische View-Platzierung","View-Sichtbarkeit","UI.ListDetail"],prompt:"Ich h\xE4tte gern einen TypeScript-Actor f\xFCr meine Notizen. Seine Oberfl\xE4che mit Eingabe und Z\xE4hler soll von selbst auf der Arbeitsfl\xE4che erscheinen: links eine durchsuchbare Titelliste, rechts die ausgew\xE4hlte Notiz. Erg\xE4nze eine erste Notiz \xFCber seine Funktion. Blende die Oberfl\xE4che kurz aus und wieder ein, ohne den Actor zu l\xF6schen oder Notizen zur\xFCckzusetzen. Lass sie zum Eintragen meiner n\xE4chsten Idee offen."},{id:"ragents.reference.prompt.95-hello-world",owner:"ragents.reference",action:"prompt",title:"Hallo Welt auf der Arbeitsfl\xE4che",description:"Ein kleines Fenster zeigt eine Begr\xFC\xDFung direkt auf der Arbeitsfl\xE4che und l\xE4sst sich in Vollansicht \xF6ffnen.",category:"Mini-Apps",order:5,tags:["Konzeptdemo","Actor-Views"],prompt:"Ich h\xE4tte gern an Deinem vorhandenen Actor eine kleine Oberfl\xE4che auf der Arbeitsfl\xE4che, die einfach nur Hallo Welt sagt. Sie soll sonst nichts tun. Lege daf\xFCr keinen neuen Actor und keine Serverfunktion an."},{id:"ragents.reference.decision-brief",owner:"ragents.reference",action:"skill",skill:"decision-brief",title:"Entscheidung kl\xE4ren",description:"Eine offene Entscheidung eingrenzen, Optionen an eigenen Kriterien messen und den n\xE4chsten Schritt festhalten.",tags:["Anwendungsfall","Konzeptdemo","Skills"],order:20},{id:"ragents.reference.learning-sprint",owner:"ragents.reference",action:"skill",skill:"learning-sprint",title:"Lernziel in Etappen",description:"Vom konkreten Lernziel \xFCber eine kleine \xDCbung zum passenden n\xE4chsten Lernschritt.",tags:["Anwendungsfall","Konzeptdemo","Skills"],order:30},{id:"ragents.reference.script.shared-actor-list",own
